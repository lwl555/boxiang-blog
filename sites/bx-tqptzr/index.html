<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薄想工作室 · 计算器</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5efe2;
  --accent: #c2402b;
  --accent2: #c98a16;
  --text: #33261d;
  --muted: #6d5c4b;
  --card-bg: rgba(255,255,255,0.45);
  --shadow: rgba(51,38,29,0.12);
}

body {
  font-family: "PingFang SC", "Noto Serif SC", "Source Han Serif", Georgia, serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(194,64,43,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(201,138,22,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 90% 70% at 50% 50%, rgba(109,92,75,0.04) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* 装饰几何 */
.deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
}
.deco-1 {
  width: 320px; height: 320px;
  top: -80px; right: -60px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  animation: spin 40s linear infinite;
}
.deco-2 {
  width: 180px; height: 180px;
  bottom: 60px; left: -40px;
  border: 2px solid var(--accent2);
  transform: rotate(45deg);
  animation: spin 30s linear infinite reverse;
}
.deco-3 {
  width: 60px; height: 60px;
  top: 40%; left: 8%;
  background: var(--accent);
  border-radius: 50%;
  opacity: 0.06;
  animation: float 6s ease-in-out infinite;
}
.deco-4 {
  width: 40px; height: 40px;
  top: 25%; right: 10%;
  background: var(--accent2);
  border-radius: 50%;
  opacity: 0.08;
  animation: float 8s ease-in-out infinite reverse;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* 头部 */
.header {
  position: relative;
  z-index: 1;
  text-align: center;
  margin-bottom: 24px;
  animation: fadeDown 0.8s ease both;
}
.header h1 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.12em;
}
.header h1 span { color: var(--accent); }
.header p {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 0.06em;
}
.header .line {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  margin: 12px auto 0;
  border-radius: 2px;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 计算器主体 */
.calc-wrapper {
  position: relative;
  z-index: 1;
  animation: fadeUp 0.8s 0.2s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.calc {
  width: clamp(300px, 80vw, 380px);
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 24px;
  padding: 24px;
  box-shadow:
    0 8px 32px var(--shadow),
    0 2px 8px rgba(194,64,43,0.06),
    inset 0 1px 0 rgba(255,255,255,0.7);
}

/* 显示屏 */
.display {
  background: linear-gradient(135deg, #3a2a1f 0%, #2c1f17 100%);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 20px;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
}
.display::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 100%);
  border-radius: 16px 16px 0 0;
  pointer-events: none;
}
.display .expr {
  font-size: 0.95rem;
  color: rgba(201,138,22,0.7);
  font-family: "Courier New", monospace;
  min-height: 24px;
  word-break: break-all;
  text-align: right;
  width: 100%;
}
.display .result {
  font-size: clamp(2rem, 8vw, 2.8rem);
  color: #f5efe2;
  font-weight: 300;
  letter-spacing: 0.02em;
  word-break: break-all;
  text-align: right;
  width: 100%;
  text-shadow: 0 0 20px rgba(201,138,22,0.3);
  line-height: 1.2;
}

/* 按钮网格 */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.btn {
  height: 58px;
  border: none;
  border-radius: 14px;
  font-size: 1.15rem;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
  font-weight: 500;
}
.btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.2) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn:hover::after { opacity: 1; }
.btn:active { transform: scale(0.95); }

/* 数字键 */
.btn-num {
  background: rgba(255,255,255,0.55);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: 0 2px 8px rgba(51,38,29,0.06);
}
.btn-num:hover {
  background: rgba(255,255,255,0.8);
  box-shadow: 0 4px 16px rgba(51,38,29,0.1);
}

/* 运算符 */
.btn-op {
  background: linear-gradient(135deg, var(--accent) 0%, #a83525 100%);
  color: #f5efe2;
  box-shadow: 0 4px 12px rgba(194,64,43,0.25);
}
.btn-op:hover {
  box-shadow: 0 6px 20px rgba(194,64,43,0.35);
  transform: translateY(-1px);
}

/* 功能键 */
.btn-fn {
  background: rgba(201,138,22,0.12);
  color: var(--accent2);
  border: 1px solid rgba(201,138,22,0.2);
}
.btn-fn:hover {
  background: rgba(201,138,22,0.22);
}

/* 等号键 */
.btn-eq {
  background: linear-gradient(135deg, var(--accent2) 0%, #b07810 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(201,138,22,0.3);
}
.btn-eq:hover {
  box-shadow: 0 6px 20px rgba(201,138,22,0.4);
  transform: translateY(-1px);
}

/* 清除键 */
.btn-clear {
  background: rgba(194,64,43,0.1);
  color: var(--accent);
  border: 1px solid rgba(194,64,43,0.15);
}
.btn-clear:hover {
  background: rgba(194,64,43,0.18);
}

.btn-0 { grid-column: span 2; }

/* 历史记录 */
.history-panel {
  margin-top: 16px;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s;
  opacity: 0;
}
.history-panel.open {
  max-height: 200px;
  opacity: 1;
}
.history-panel-inner {
  background: rgba(255,255,255,0.3);
  border-radius: 12px;
  padding: 12px 16px;
  max-height: 160px;
  overflow-y: auto;
}
.history-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(51,38,29,0.06);
  font-size: 0.85rem;
  cursor: pointer;
  transition: color 0.15s;
  color: var(--muted);
}
.history-item:hover { color: var(--accent); }
.history-item:last-child { border-bottom: none; }
.history-item .h-expr { font-family: monospace; }
.history-item .h-result { font-weight: 600; }

.history-toggle {
  margin-top: 12px;
  width: 100%;
  height: 36px;
  background: none;
  border: 1px dashed rgba(51,38,29,0.2);
  border-radius: 10px;
  color: var(--muted);
  font-family: inherit;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.05em;
}
.history-toggle:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* 页脚 */
.footer {
  position: relative;
  z-index: 1;
  margin-top: 24px;
  text-align: center;
  animation: fadeUp 0.8s 0.4s ease both;
}
.footer a {
  display: inline-block;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--accent) 0%, #a83525 100%);
  color: #f5efe2;
  text-decoration: none;
  border-radius: 30px;
  font-size: 0.9rem;
  letter-spacing: 0.06em;
  box-shadow: 0 4px 16px rgba(194,64,43,0.25);
  transition: all 0.2s;
}
.footer a:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(194,64,43,0.35);
}
.footer .credit {
  margin-top: 12px;
  font-size: 0.72rem;
  color: var(--muted);
  opacity: 0.6;
}

/* 响应式 */
@media (max-width: 400px) {
  .calc { padding: 16px; border-radius: 18px; }
  .btn { height: 50px; font-size: 1rem; border-radius: 12px; }
  .buttons { gap: 8px; }
  .display { padding: 16px 18px; min-height: 90px; }
}
</style>
</head>
<body>

<!-- 装饰元素 -->
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>
<div class="deco deco-3"></div>
<div class="deco deco-4"></div>

<!-- 头部 -->
<div class="header">
  <h1>薄想 <span>·</span> 计算器</h1>
  <p>简洁 · 优雅 · 高效</p>
  <div class="line"></div>
</div>

<!-- 计算器主体 -->
<div class="calc-wrapper">
  <div class="calc">
    <!-- 显示屏 -->
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

    <!-- 按钮 -->
    <div class="buttons">
      <button class="btn btn-clear" data-action="clear">C</button>
      <button class="btn btn-fn" data-action="ce">CE</button>
      <button class="btn btn-fn" data-action="sign">±</button>
      <button class="btn btn-op" data-action="op" data-value="÷">÷</button>

      <button class="btn btn-num" data-action="num" data-value="7">7</button>
      <button class="btn btn-num" data-action="num" data-value="8">8</button>
      <button class="btn btn-num" data-action="num" data-value="9">9</button>
      <button class="btn btn-op" data-action="op" data-value="×">×</button>

      <button class="btn btn-num" data-action="num" data-value="4">4</button>
      <button class="btn btn-num" data-action="num" data-value="5">5</button>
      <button class="btn btn-num" data-action="num" data-value="6">6</button>
      <button class="btn btn-op" data-action="op" data-value="−">−</button>

      <button class="btn btn-num" data-action="num" data-value="1">1</button>
      <button class="btn btn-num" data-action="num" data-value="2">2</button>
      <button class="btn btn-num" data-action="num" data-value="3">3</button>
      <button class="btn btn-op" data-action="op" data-value="+">+</button>

      <button class="btn btn-num btn-0" data-action="num" data-value="0">0</button>
      <button class="btn btn-num" data-action="dot">.</button>
      <button class="btn btn-eq" data-action="equal">=</button>
    </div>

    <!-- 历史 -->
    <button class="history-toggle" id="historyToggle">▾ 计算历史</button>
    <div class="history-panel" id="historyPanel">
      <div class="history-panel-inner" id="historyList"></div>
    </div>
  </div>
</div>

<!-- 页脚 -->
<div class="footer">
  <a href="https://lwl555.github.io/boxiang-blog/#order">向薄想工作室下单</a>
  <div class="credit">由 薄想工作室 免费生成 · lwl555.github.io/boxiang-blog</div>
</div>

<script>
(function() {
  'use strict';

  // 状态
  let currentInput = '0';
  let previousInput = '';
  let operator = null;
  let shouldResetScreen = false;
  let expression = '';
  let history = [];

  // DOM
  const resultEl = document.getElementById('result');
  const exprEl = document.getElementById('expr');
  const historyPanel = document.getElementById('historyPanel');
  const historyList = document.getElementById('historyList');
  const historyToggle = document.getElementById('historyToggle');

  // 加载历史
  try {
    const saved = localStorage.getItem('bx_calc_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) {}
  renderHistory();

  // 更新显示
  function updateDisplay() {
    resultEl.textContent = currentInput;
    exprEl.textContent = expression;

    // 自适应字号
    const len = currentInput.length;
    if (len > 12) resultEl.style.fontSize = '1.4rem';
    else if (len > 9) resultEl.style.fontSize = '1.8rem';
    else resultEl.style.fontSize = '';
  }

  // 输入数字
  function inputNum(val) {
    if (shouldResetScreen) {
      currentInput = val;
      shouldResetScreen = false;
    } else {
      if (currentInput === '0' && val !== '.') {
        currentInput = val;
      } else {
        if (currentInput.length >= 15) return;
        currentInput += val;
      }
    }
    updateDisplay();
  }

  // 输入运算符
  function inputOp(op) {
    const current = parseFloat(currentInput);
    if (operator && !shouldResetScreen) {
      const prev = parseFloat(previousInput);
      const result = calculate(prev, current, operator);
      currentInput = formatResult(result);
      expression = currentInput + ' ' + op;
    } else {
      expression = currentInput + ' ' + op;
    }
    previousInput = currentInput;
    operator = op;
    shouldResetScreen = true;
    updateDisplay();
  }

  // 计算
  function calculate(a, b, op) {
    switch(op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b !== 0 ? a / b : NaN;
      default: return b;
    }
  }

  // 格式化结果
  function formatResult(num) {
    if (isNaN(num)) return '错误';
    if (!isFinite(num)) return '错误';
    const str = parseFloat(num.toFixed(10)).toString();
    return str;
  }

  // 等号
  function inputEqual() {
    if (!operator) return;
    const current = parseFloat(currentInput);
    const prev = parseFloat(previousInput);
    const result = calculate(prev, current, operator);
    const resultStr = formatResult(result);
    const fullExpr = previousInput + ' ' + operator + ' ' + currentInput;

    // 加入历史
    const record = { expr: fullExpr, result: resultStr, time: Date.now() };
    history.unshift(record);
    if (history.length > 20) history.pop();
    try { localStorage.setItem('bx_calc_history', JSON.stringify(history)); } catch(e) {}
    renderHistory();

    expression = fullExpr + ' =';
    currentInput = resultStr;
    operator = null;
    previousInput = '';
    shouldResetScreen = true;
    updateDisplay();
  }

  // 清除
  function inputClear() {
    currentInput = '0';
    previousInput = '';
    operator = null;
    expression = '';
    shouldResetScreen = false;
    updateDisplay();
  }

  // 清除输入
  function inputCE() {
    currentInput = '0';
    updateDisplay();
  }

  // 正负切换
  function inputSign() {
    if (currentInput === '0') return;
    if (currentInput.startsWith('-')) {
      currentInput = currentInput.slice(1);
    } else {
      currentInput = '-' + currentInput;
    }
    updateDisplay();
  }

  // 小数点
  function inputDot() {
    if (shouldResetScreen) {
      currentInput = '0.';
      shouldResetScreen = false;
      updateDisplay();
      return;
    }
    if (!currentInput.includes('.')) {
      currentInput += '.';
      updateDisplay();
    }
  }

  // 渲染历史
  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:8px;">暂无计算记录</div>';
      return;
    }
    historyList.innerHTML = history.map((h, i) => `
      <div class="history-item" data-idx="${i}">
        <span class="h-expr">${h.expr}</span>
        <span class="h-result">= ${h.result}</span>
      </div>
    `).join('');

    historyList.querySelectorAll('.history-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        currentInput = history[idx].result;
        shouldResetScreen = true;
        expression = history[idx].expr + ' =';
        updateDisplay();
      });
    });
  }

  // 按钮点击
  document.querySelector('.buttons').addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (!btn) return;
    const action = btn.dataset.action;
    const val = btn.dataset.value;

    switch(action) {
      case 'num': inputNum(val); break;
      case 'op': inputOp(val); break;
      case 'equal': inputEqual(); break;
      case 'clear': inputClear(); break;
      case 'ce': inputCE(); break;
      case 'sign': inputSign(); break;
      case 'dot': inputDot(); break;
    }
  });

  // 历史切换
  historyToggle.addEventListener('click', () => {
    historyPanel.classList.toggle('open');
    historyToggle.textContent = historyPanel.classList.contains('open') ? '▴ 计算历史' : '▾ 计算历史';
  });

  // 按钮光晕跟随鼠标
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('mousemove', e => {
      const rect = btn.getBoundingClientRect();
      btn.style.setProperty('--x', ((e.clientX - rect.left) / rect.width * 100) + '%');
      btn.style.setProperty('--y', ((e.clientY - rect.top) / rect.height * 100) + '%');
    });
  });

  // 键盘支持
  document.addEventListener('keydown', e => {
    const key = e.key;
    if (/^[0-9]$/.test(key)) inputNum(key);
    else if (key === '.') inputDot();
    else if (key === '+') inputOp('+');
    else if (key === '-') inputOp('−');
    else if (key === '*') inputOp('×');
    else if (key === '/') { e.preventDefault(); inputOp('÷'); }
    else if (key === 'Enter' || key === '=') inputEqual();
    else if (key === 'Escape') inputClear();
    else if (key === 'Backspace') {
      if (!shouldResetScreen && currentInput.length > 1) {
        currentInput = currentInput.slice(0, -1);
      } else {
        currentInput = '0';
      }
      updateDisplay();
    }
  });

  updateDisplay();
})();
</script>
</body>
</html>
